<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Week</title>
  <link rel="stylesheet" href="static/memory_week.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">KMLog</p>
        <h1>Memory Week</h1>
      </div>
      <label class="token-field">
        <span>Token</span>
        <input id="apiToken" type="password" autocomplete="off">
      </label>
    </header>

    <section class="filters" aria-label="Weekly memory filters">
      <label class="field">
        <span>Start</span>
        <input id="startDate" type="date">
      </label>
      <label class="field">
        <span>End</span>
        <input id="endDate" type="date">
      </label>
      <label class="field">
        <span>Status</span>
        <select id="statusFilter">
          <option value="candidate">candidate</option>
          <option value="">all</option>
          <option value="accepted">accepted</option>
          <option value="rejected">rejected</option>
          <option value="deferred">deferred</option>
          <option value="merged">merged</option>
          <option value="superseded">superseded</option>
          <option value="promoted">promoted</option>
        </select>
      </label>
      <label class="field">
        <span>Domain</span>
        <input id="domainFilter" type="search" placeholder="Any">
      </label>
      <label class="field">
        <span>Function</span>
        <input id="functionFilter" type="search" placeholder="Any">
      </label>
      <label class="field wide">
        <span>Search</span>
        <input id="keywordFilter" type="search" placeholder="Label or evidence">
      </label>
      <button id="loadButton" class="primary-button" type="button">Load</button>
      <button id="exportButton" class="secondary-button" type="button">Export</button>
    </section>

    <section class="stats-grid" aria-live="polite">
      <article class="stat-card">
        <span>Raw</span>
        <strong id="rawCount">0</strong>
      </article>
      <article class="stat-card">
        <span>Deduped</span>
        <strong id="groupCount">0</strong>
      </article>
      <article class="stat-card">
        <span>Accepted</span>
        <strong id="acceptedCount">0</strong>
      </article>
      <article class="stat-card">
        <span>Rejected</span>
        <strong id="rejectedCount">0</strong>
      </article>
    </section>

    <section class="visual-grid">
      <div class="panel">
        <div class="panel-heading">
          <h2>Domains</h2>
        </div>
        <div id="domainBars" class="bars"></div>
      </div>
      <div class="panel">
        <div class="panel-heading">
          <h2>Functions</h2>
        </div>
        <div id="functionBars" class="bars"></div>
      </div>
    </section>

    <section class="list-shell">
      <div class="panel-heading">
        <h2>Candidates</h2>
        <p id="message" role="status"></p>
      </div>
      <div id="candidateList" class="candidate-list"></div>
      <p id="emptyState" class="empty-state" hidden>No candidates.</p>
    </section>

    <dialog id="exportDialog">
      <form method="dialog">
        <div class="dialog-heading">
          <h2>Weekly Markdown</h2>
          <button class="icon-button" value="close" aria-label="Close" type="submit">x</button>
        </div>
        <textarea id="exportText" rows="16" readonly></textarea>
      </form>
    </dialog>

    <dialog id="promoteDialog">
      <form id="promoteForm" method="dialog">
        <div class="dialog-heading">
          <h2>Promote Candidate</h2>
          <button class="icon-button" value="close" aria-label="Close" type="submit">x</button>
        </div>
        <input id="promoteCandidateIds" type="hidden">
        <div class="promote-grid">
          <label class="field wide">
            <span>Title</span>
            <input id="promoteTitle" required>
          </label>
          <label class="field wide">
            <span>Content</span>
            <textarea id="promoteContent" rows="5" required></textarea>
          </label>
          <label class="field wide">
            <span>Evidence</span>
            <textarea id="promoteEvidence" rows="3"></textarea>
          </label>
          <label class="field">
            <span>Domain</span>
            <input id="promoteDomain" required>
          </label>
          <label class="field">
            <span>Function</span>
            <input id="promoteFunction" required>
          </label>
          <label class="field">
            <span>Primary Mother</span>
            <input id="promotePrimaryMother">
          </label>
          <label class="field">
            <span>Secondary Mother</span>
            <input id="promoteSecondaryMother">
          </label>
          <label class="field">
            <span>Importance</span>
            <input id="promoteImportance" type="number" min="1" max="5">
          </label>
          <label class="field">
            <span>Confidence</span>
            <select id="promoteConfidence">
              <option value="">unspecified</option>
              <option value="low">low</option>
              <option value="medium">medium</option>
              <option value="high">high</option>
              <option value="very_high">very_high</option>
            </select>
          </label>
          <label class="field">
            <span>Explicitness</span>
            <select id="promoteExplicitness">
              <option value="edited_by_human">edited_by_human</option>
              <option value="explicit_user_said">explicit_user_said</option>
              <option value="inferred">inferred</option>
              <option value="assistant_interpreted">assistant_interpreted</option>
            </select>
          </label>
          <label class="field">
            <span>Reviewer</span>
            <input id="promoteReviewer" value="human">
          </label>
        </div>
        <div class="dialog-actions">
          <button class="secondary-button" value="cancel" type="submit">Cancel</button>
          <button id="promoteSubmit" class="primary-button" value="promote" type="button">Promote</button>
        </div>
      </form>
    </dialog>
  </main>

  <script src="static/memory_week.js"></script>
</body>
</html>
